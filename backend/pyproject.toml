[project]
name = "aquaagent-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.12,<3", "numpy>=2.4,<3", "networkx>=3.5,<4", "boto3>=1.43,<2", "langgraph>=1.0,<2", "groq>=0.30,<1", "tzdata>=2026.1"]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "hypothesis>=6.140,<7", "moto[dynamodb,s3,stepfunctions,secretsmanager]>=5.1,<6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
